<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cytophage 2.0 — Живой мир</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        #canvas {
            display: block;
            background: #0d1117;
            border-radius: 0;
        }

        /* HUD - Верхняя панель */
        .hud-top {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 20px;
            background: linear-gradient(180deg, rgba(10,10,26,0.95) 0%, rgba(10,10,26,0.7) 100%);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .server-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            transition: all 0.3s;
        }

        .status-dot.ok {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .status-dot.bad {
            background: #ff4444;
            box-shadow: 0 0 10px #ff4444;
        }

        .ping-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            font-size: 12px;
            font-family: monospace;
        }

        .ping-value {
            font-weight: bold;
            color: #4ECDC4;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            font-size: 13px;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-icon {
            font-size: 16px;
        }

        .stat-value {
            color: #79c0ff;
            font-weight: bold;
            font-family: monospace;
        }

        /* Боковая панель событий */
        .events-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 350px;
            max-height: 300px;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            overflow-y: auto;
        }

        .events-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .event-item {
            font-size: 12px;
            padding: 4px 0;
            color: #aaa;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .event-item.combat { color: #ff6b6b; }
        .event-item.birth { color: #00ff88; }
        .event-item.system { color: #45b7d1; }

        /* Панель кланов */
        .clans-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            width: 250px;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 100;
            max-height: 400px;
            overflow-y: auto;
        }

        .clan-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 0;
            font-size: 13px;
        }

        .clan-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .clan-name {
            flex: 1;
            font-weight: 500;
        }

        .clan-count {
            color: #79c0ff;
            font-family: monospace;
        }

        /* Подсказка */
        .tooltip {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(10, 10, 26, 0.9);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #888;
            z-index: 100;
        }

        /* Скроллбар */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <!-- Верхняя панель -->
    <div class="hud-top">
        <div class="server-status">
            <div class="status-dot" id="statusDot"></div>
            <span id="serverText">Подключение...</span>
        </div>

        <div class="stats-bar">
            <div class="stat-item">
                <span class="stat-icon">🧬</span>
                <span>Популяция:</span>
                <span class="stat-value" id="popStat">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🍎</span>
                <span>Еда:</span>
                <span class="stat-value" id="foodStat">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">⏱️</span>
                <span>Аптайм:</span>
                <span class="stat-value" id="uptimeStat">0с</span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">⚡</span>
                <span>Тик:</span>
                <span class="stat-value" id="tickStat">0</span>
            </div>
        </div>

        <div class="ping-indicator">
            <span>📡 Пинг:</span>
            <span class="ping-value" id="pingValue">---ms</span>
        </div>
    </div>

    <!-- Панель кланов -->
    <div class="clans-panel">
        <div class="events-title">Кланы</div>
        <div id="clansContainer"></div>
    </div>

    <!-- Панель событий -->
    <div class="events-panel">
        <div class="events-title">Летопись мира</div>
        <div id="eventsContainer"></div>
    </div>

    <div class="tooltip">
        🖱️ Наведите на бактерию для деталей
    </div>

    <script>
        const SERVER_URL = window.location.origin;
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let worldState = null;
        let lastFetch = 0;
        let pingMs = 0;
        let lastPingTime = 0;
        let isServerOk = false;
        let hoveredBacterium = null;

        // Размер canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        // Форматирование аптайма
        function formatUptime(seconds) {
            if (seconds < 60) return `${seconds}с`;
            if (seconds < 3600) return `${Math.floor(seconds/60)}м ${seconds%60}с`;
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return `${h}ч ${m}м`;
        }

        // Fetch состояния
        async function fetchState() {
            const startTime = Date.now();
            try {
                const res = await fetch(`${SERVER_URL}/state`, { cache: "no-cache" });
                const data = await res.json();
                worldState = data;
                pingMs = Date.now() - startTime;
                lastPingTime = Date.now();

                if (!isServerOk) {
                    isServerOk = true;
                    document.getElementById("statusDot").classList.add("ok");
                    document.getElementById("statusDot").classList.remove("bad");
                    document.getElementById("serverText").textContent = "Сервер онлайн";
                }

                updateHUD();
            } catch (err) {
                console.error("Fetch error:", err);
                if (isServerOk) {
                    isServerOk = false;
                    document.getElementById("statusDot").classList.remove("ok");
                    document.getElementById("statusDot").classList.add("bad");
                    document.getElementById("serverText").textContent = "Сервер недоступен";
                }
            }
        }

        // Пинг
        async function fetchPing() {
            try {
                const res = await fetch(`${SERVER_URL}/ping`, { cache: "no-cache" });
                const data = await res.json();
                if (data.status === "alive") {
                    pingMs = Date.now() - lastPingTime || 50;
                }
            } catch(e) {}
        }

        // Обновление HUD
        function updateHUD() {
            if (!worldState) return;

            const stats = worldState.stats;
            document.getElementById("popStat").textContent = stats.population;
            document.getElementById("foodStat").textContent = stats.foodCount;
            document.getElementById("uptimeStat").textContent = formatUptime(stats.uptime);
            document.getElementById("tickStat").textContent = stats.tickCount;

            const pingColor = pingMs < 100 ? "#00ff88" : pingMs < 300 ? "#ffe66d" : "#ff6b6b";
            document.getElementById("pingValue").textContent = `${pingMs}ms`;
            document.getElementById("pingValue").style.color = pingColor;

            // Кланы
            const clansContainer = document.getElementById("clansContainer");
            clansContainer.innerHTML = "";
            if (stats.clanStats) {
                const sorted = Object.entries(stats.clanStats)
                    .sort((a, b) => b[1].count - a[1].count);
                for (const [id, clan] of sorted) {
                    const div = document.createElement("div");
                    div.className = "clan-item";
                    div.innerHTML = `
                        <div class="clan-dot" style="background: ${clan.color}"></div>
                        <span class="clan-name">Клан ${id}</span>
                        <span class="clan-count">${clan.count} (g${clan.avgGen})</span>
                    `;
                    clansContainer.appendChild(div);
                }
            }

            // События
            const eventsContainer = document.getElementById("eventsContainer");
            eventsContainer.innerHTML = "";
            if (worldState.events) {
                for (const event of worldState.events.slice(-15).reverse()) {
                    const div = document.createElement("div");
                    div.className = `event-item ${event.type}`;
                    div.textContent = event.message;
                    eventsContainer.appendChild(div);
                }
            }
        }

        // Отрисовка
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!worldState) {
                requestAnimationFrame(draw);
                return;
            }

            // Масштабирование мира к экрану
            const scaleX = canvas.width / worldState.world.width;
            const scaleY = canvas.height / worldState.world.height;
            const scale = Math.min(scaleX, scaleY) * 0.9;
            const offsetX = (canvas.width - worldState.world.width * scale) / 2;
            const offsetY = (canvas.height - worldState.world.height * scale) / 2;

            // Рисуем границу мира
            ctx.strokeStyle = "rgba(255,255,255,0.1)";
            ctx.lineWidth = 2;
            ctx.strokeRect(
                offsetX, offsetY,
                worldState.world.width * scale,
                worldState.world.height * scale
            );

            // Еда
            ctx.fillStyle = "#4ECDC4";
            for (const f of worldState.food) {
                const sx = offsetX + f.x * scale;
                const sy = offsetY + f.y * scale;
                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(1, f.radius * scale * 0.3), 0, Math.PI * 2);
                ctx.fill();
            }

            // Бактерии
            hoveredBacterium = null;
            for (const b of worldState.bacteria) {
                const sx = offsetX + b.x * scale;
                const sy = offsetY + b.y * scale;
                const sr = Math.max(3, b.size * scale * 0.8);

                // Проверяем наведение
                const dx = mouseX - sx;
                const dy = mouseY - sy;
                if (dx*dx + dy*dy < sr*sr + 100) {
                    hoveredBacterium = b;
                }

                // Тело
                const energyPercent = b.energy / 100;
                ctx.globalAlpha = 0.6 + energyPercent * 0.4;
                ctx.fillStyle = b.clanColor;
                ctx.beginPath();
                ctx.arc(sx, sy, sr, 0, Math.PI * 2);
                ctx.fill();

                // Обводка
                ctx.globalAlpha = 1;
                ctx.strokeStyle = b.clanColor;
                ctx.lineWidth = 2;
                ctx.stroke();

                // HP бар
                if (b.hp < 100) {
                    const hpPercent = b.hp / 100;
                    ctx.fillStyle = "rgba(0,0,0,0.5)";
                    ctx.fillRect(sx - sr, sy - sr - 6, sr * 2, 3);
                    ctx.fillStyle = hpPercent > 0.5 ? "#00ff88" : hpPercent > 0.25 ? "#ffe66d" : "#ff4444";
                    ctx.fillRect(sx - sr, sy - sr - 6, sr * 2 * hpPercent, 3);
                }

                // ID
                if (sr > 5) {
                    ctx.fillStyle = "rgba(255,255,255,0.8)";
                    ctx.font = `${Math.max(8, sr * 0.8)}px monospace`;
                    ctx.textAlign = "center";
                    ctx.fillText(`#${b.id}`, sx, sy + 3);
                }
            }

            // Тултип при наведении
            if (hoveredBacterium) {
                const b = hoveredBacterium;
                const tooltipX = offsetX + b.x * scale + 20;
                const tooltipY = offsetY + b.y * scale - 20;

                ctx.fillStyle = "rgba(10,10,26,0.95)";
                ctx.strokeStyle = b.clanColor;
                ctx.lineWidth = 1;

                const text = [
                    `ID: #${b.id} (Клан ${b.clanId})`,
                    `Поколение: ${b.generation}`,
                    `Энергия: ${b.energy}/100`,
                    `HP: ${b.hp}/100`,
                    `Возраст: ${Math.floor(b.age / 20)}с`,
                    `Скорость: ${b.speed}`,
                    `Размер: ${b.size}`,
                    `Агрессия: ${(b.aggression * 100).toFixed(0)}%`,
                    `Цель: ${b.target || "блуждание"}`,
                ];

                const lineHeight = 16;
                const padding = 10;
                const width = 200;
                const height = text.length * lineHeight + padding * 2;

                ctx.fillRect(tooltipX, tooltipY, width, height);
                ctx.strokeRect(tooltipX, tooltipY, width, height);

                ctx.fillStyle = "#e0e0e0";
                ctx.font = "12px monospace";
                ctx.textAlign = "left";
                text.forEach((line, i) => {
                    ctx.fillText(line, tooltipX + padding, tooltipY + padding + (i + 1) * lineHeight);
                });
            }

            requestAnimationFrame(draw);
        }

        // Мышь
        let mouseX = 0, mouseY = 0;
        canvas.addEventListener("mousemove", (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        // Запуск
        setInterval(fetchState, 200);
        setInterval(fetchPing, 5000);
        fetchState();
        fetchPing();
        requestAnimationFrame(draw);
    </script>
</body>
</html>
