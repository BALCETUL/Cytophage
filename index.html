<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐠 Аквариум — Живая экосистема</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0e1a; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; height: 100vh; color: #e0e0e0; }
    #canvas { display: block; cursor: crosshair; }
    .hud-top { position: fixed; top: 0; left: 0; right: 0; padding: 10px 20px;
        background: linear-gradient(180deg, rgba(10,14,26,0.95), rgba(10,14,26,0.8));
        backdrop-filter: blur(12px); display: flex; align-items: center;
        justify-content: space-between; z-index: 100; border-bottom: 1px solid rgba(100,200,255,0.2); flex-wrap: wrap; gap: 8px; }
    .server-status { display: flex; align-items: center; gap: 10px; }
    .status-indicator { display: flex; align-items: center; gap: 8px; padding: 6px 14px;
        background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; transition: all 0.3s; }
    .status-dot.online { background: #00ff88; box-shadow: 0 0 8px #00ff88; animation: pulse 2s infinite; }
    .status-dot.offline { background: #ff4444; box-shadow: 0 0 8px #ff4444; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    .ping-display { display: flex; align-items: center; gap: 6px; padding: 6px 14px;
        background: rgba(255,255,255,0.05); border-radius: 20px; font-family: monospace; font-size: 13px;
        border: 1px solid rgba(255,255,255,0.1); }
    .ping-good { color: #00ff88; } .ping-mid { color: #ffcc00; } .ping-bad { color: #ff4444; }
    .stats-bar { display: flex; gap: 14px; font-size: 13px; flex-wrap: wrap; }
    .stat { display: flex; align-items: center; gap: 6px; }
    .stat-label { color: #888; }
    .stat-value { font-family: monospace; color: #79c0ff; font-weight: bold; }
    .game-time { display: flex; align-items: center; gap: 6px; padding: 6px 14px;
        background: rgba(100,200,255,0.1); border-radius: 20px; border: 1px solid rgba(100,200,255,0.2);
        font-family: monospace; font-size: 13px; }
    .water-panel { position: fixed; top: 60px; left: 20px; width: 200px; background: rgba(10,14,26,0.9);
        backdrop-filter: blur(12px); border-radius: 12px; padding: 14px; border: 1px solid rgba(100,200,255,0.2); z-index: 100; }
    .panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #666; margin-bottom: 12px; }
    .meter { margin-bottom: 10px; }
    .meter-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
    .meter-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
    .meter-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
    .meter-fill.oxygen { background: linear-gradient(90deg, #ff4444, #ffcc00, #00ff88); }
    .meter-fill.quality { background: linear-gradient(90deg, #8b4513, #ffcc00, #4169e1); }
    .species-panel { position: fixed; top: 60px; right: 20px; width: 280px; background: rgba(10,14,26,0.9);
        backdrop-filter: blur(12px); border-radius: 12px; padding: 14px; border: 1px solid rgba(100,200,255,0.2);
        z-index: 100; max-height: 500px; overflow-y: auto; }
    .species-item { display: flex; align-items: center; gap: 10px; padding: 8px; margin-bottom: 6px;
        background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 3px solid; }
    .species-icon { font-size: 20px; min-width: 30px; text-align: center; }
    .species-info { flex: 1; }
    .species-name { font-size: 13px; font-weight: 500; }
    .species-latin { font-size: 10px; color: #666; font-style: italic; }
    .species-count { text-align: right; font-family: monospace; font-size: 12px; }
    .count-adults { color: #79c0ff; } .count-fry { color: #98fb98; } .count-eggs { color: #ffd700; }
    .events-panel { position: fixed; bottom: 20px; left: 20px; width: 400px; max-height: 220px;
        background: rgba(10,14,26,0.9); backdrop-filter: blur(12px); border-radius: 12px; padding: 14px;
        border: 1px solid rgba(100,200,255,0.2); z-index: 100; overflow-y: auto; }
    .event { padding: 4px 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); color: #aaa; }
    .event.birth { color: #98fb98; } .event.death { color: #ff6b6b; }
    .event.combat { color: #ff9f43; } .event.system { color: #79c0ff; }
    .event-time { font-family: monospace; color: #555; font-size: 10px; margin-right: 8px; }
    .feed-panel { position: fixed; bottom: 20px; right: 20px; z-index: 100;
        background: rgba(10,14,26,0.9); backdrop-filter: blur(12px); border-radius: 14px;
        padding: 16px; border: 1px solid rgba(255,200,100,0.3); text-align: center; }
    #feedBtn { background: linear-gradient(135deg, #ff9f43, #ff6b35); color: #fff; border: none;
        padding: 14px 28px; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer;
        box-shadow: 0 4px 15px rgba(255,150,60,0.4); transition: all 0.2s; font-family: inherit; }
    #feedBtn:hover { transform: scale(1.05); }
    #feedBtn:active { transform: scale(0.95); }
    #feedBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .feed-stats { margin-top: 10px; font-size: 12px; color: #aaa; }
    .feed-stats b { color: #ffcc00; font-family: monospace; }
    .tooltip { position: fixed; background: rgba(10,14,26,0.95); backdrop-filter: blur(12px);
        border: 1px solid rgba(100,200,255,0.3); border-radius: 10px; padding: 12px 16px; font-size: 12px;
        pointer-events: none; z-index: 200; display: none; min-width: 200px; }
    .tooltip-name { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
    .tooltip-species { font-size: 11px; color: #888; font-style: italic; margin-bottom: 8px; }
    .tooltip-stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
    .tooltip-label { color: #888; } .tooltip-value { color: #79c0ff; font-family: monospace; }
    .bar-mini { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 2px; }
    .bar-mini-fill { height: 100%; border-radius: 2px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: rgba(100,200,255,0.3); border-radius: 3px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="hud-top">
    <div class="server-status">
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="serverText">Поиск сервера...</span>
        </div>
        <div class="ping-display">📡 <span id="pingValue" class="ping-good">---</span>ms</div>
    </div>
    <div class="stats-bar">
        <div class="stat"><span class="stat-label">🐟 Рыб:</span><span class="stat-value" id="fishCount">0</span></div>
        <div class="stat"><span class="stat-label">👶 Мальков:</span><span class="stat-value" id="fryCount">0</span></div>
        <div class="stat"><span class="stat-label">🥚 Икры:</span><span class="stat-value" id="eggCount">0</span></div>
        <div class="stat"><span class="stat-label">🦠 Бактерий:</span><span class="stat-value" id="bacteriaCount">0</span></div>
    </div>
    <div class="game-time">📅 День <span id="gameDay">0</span> ⏰ <span id="gameHour">00</span>:00</div>
</div>

<div class="water-panel">
    <div class="panel-title">Состояние воды</div>
    <div class="meter"><div class="meter-label"><span>💧 Кислород</span><span id="oxygenValue">100%</span></div>
        <div class="meter-bar"><div class="meter-fill oxygen" id="oxygenBar" style="width:100%"></div></div></div>
    <div class="meter"><div class="meter-label"><span>✨ Качество</span><span id="qualityValue">100%</span></div>
        <div class="meter-bar"><div class="meter-fill quality" id="qualityBar" style="width:100%"></div></div></div>
    <div class="meter"><div class="meter-label"><span>🌡️ Температура</span><span id="tempValue">25°C</span></div></div>
    <div class="meter"><div class="meter-label"><span>⚗️ pH</span><span id="phValue">7.0</span></div></div>
    <div class="meter" style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.1);">
        <div class="meter-label"><span>⏱️ Аптайм</span><span id="uptimeValue" style="color:#79c0ff;">0м</span></div></div>
</div>

<div class="species-panel">
    <div class="panel-title">Виды рыб</div>
    <div id="speciesContainer"></div>
</div>

<div class="events-panel">
    <div class="panel-title">Летопись аквариума</div>
    <div id="eventsContainer"></div>
</div>

<div class="feed-panel">
    <button id="feedBtn">🍞 Покормить рыбок</button>
    <div class="feed-stats">
        Кормлений посетителями: <b id="manualFeeds">0</b><br>
        Авто-кормлений: <b id="autoFeeds">0</b>
    </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const RENDER_URL = "https://cytophage.onrender.com";
let SERVER_URL = null;

async function detectServer() {
    const candidates = [];
    if (location.protocol === "http:" || location.protocol === "https:") candidates.push(location.origin);
    candidates.push("http://localhost:3000");
    if (!candidates.includes(RENDER_URL)) candidates.push(RENDER_URL);
    for (const url of candidates) {
        try {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), 4000);
            const res = await fetch(url + "/ping", { cache: "no-cache", signal: ctrl.signal });
            clearTimeout(t);
            if (res.ok) { SERVER_URL = url; return true; }
        } catch (e) {}
    }
    return false;
}

async function ensureServer() {
    while (!SERVER_URL) {
        if (await detectServer()) {
            document.getElementById("serverText").textContent = "Сервер онлайн";
            document.getElementById("statusDot").classList.add("online");
            startPolling();
        } else {
            await new Promise(r => setTimeout(r, 5000));
        }
    }
}

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let worldState = null, pingMs = 0, serverOnline = false;
let hoveredEntity = null, mouseX = 0, mouseY = 0;
let scaleX = 1, scaleY = 1, offsetX = 0, offsetY = 0;
let failCount = 0;
let bgCanvas = null; // ⭐ кэш фона

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; bgCanvas = null; }
addEventListener("resize", resize);
resize();

function formatUptime(s) {
    if (s < 60) return s + "с";
    if (s < 3600) return Math.floor(s / 60) + "м";
    return Math.floor(s / 3600) + "ч " + Math.floor((s % 3600) / 60) + "м";
}
const SPECIES_ICONS = { guppy: "🐠", neon: "✨", angelfish: "👼", swordtail: "⚔️", corydoras: "🐡", cichlid: "🦈" };

// ===== КОРМЛЕНИЕ =====
const feedBtn = document.getElementById("feedBtn");
feedBtn.addEventListener("click", async () => {
    if (!SERVER_URL) return;
    feedBtn.disabled = true;
    try {
        const res = await fetch(SERVER_URL + "/feed", { method: "POST" });
        const d = await res.json();
        if (d.ok) {
            document.getElementById("manualFeeds").textContent = d.manualFeeds;
            document.getElementById("autoFeeds").textContent = d.autoFeeds;
        }
    } catch (e) {}
    setTimeout(() => feedBtn.disabled = false, 1500);
});

// ===== ⭐ ОПРОС 500мс + ТАЙМАУТ + ЗАЩИТА ОТ МИГАНИЯ =====
let polling = false;
function startPolling() {
    if (polling) return;
    polling = true;
    setInterval(fetchState, 500);
    fetchState();
}

async function fetchState() {
    const start = Date.now();
    try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 6000);
        const res = await fetch(SERVER_URL + "/state", { cache: "no-cache", signal: ctrl.signal });
        clearTimeout(t);
        worldState = await res.json();
        pingMs = Date.now() - start;
        failCount = 0;
        if (!serverOnline) {
            serverOnline = true;
            document.getElementById("statusDot").classList.add("online");
            document.getElementById("statusDot").classList.remove("offline");
            document.getElementById("serverText").textContent = "Сервер онлайн";
        }
        updateHUD();
    } catch (err) {
        failCount++;
        // ⭐ офлайн только после 3 неудач подряд
        if (failCount >= 3 && serverOnline) {
            serverOnline = false;
            document.getElementById("statusDot").classList.remove("online");
            document.getElementById("statusDot").classList.add("offline");
            document.getElementById("serverText").textContent = "Сервер офлайн";
        }
    }
}

function updateHUD() {
    if (!worldState) return;
    document.getElementById("fishCount").textContent = worldState.fishes.length;
    document.getElementById("fryCount").textContent = worldState.fry.length;
    document.getElementById("eggCount").textContent = worldState.eggs.length;
    document.getElementById("bacteriaCount").textContent = worldState.bacteria.length;
    document.getElementById("gameDay").textContent = worldState.gameTime.days;
    document.getElementById("gameHour").textContent = String(worldState.gameTime.hours).padStart(2, "0");

    const p = document.getElementById("pingValue");
    p.textContent = pingMs;
    p.className = pingMs < 100 ? "ping-good" : pingMs < 300 ? "ping-mid" : "ping-bad";

    const env = worldState.environment;
    document.getElementById("oxygenValue").textContent = Math.round(env.oxygen) + "%";
    document.getElementById("oxygenBar").style.width = env.oxygen + "%";
    document.getElementById("qualityValue").textContent = Math.round(env.quality) + "%";
    document.getElementById("qualityBar").style.width = env.quality + "%";
    document.getElementById("tempValue").textContent = env.temperature.toFixed(1) + "°C";
    document.getElementById("phValue").textContent = env.ph.toFixed(1);
    document.getElementById("uptimeValue").textContent = formatUptime(worldState.stats.serverUptime);
    document.getElementById("manualFeeds").textContent = worldState.stats.manualFeeds || 0;
    document.getElementById("autoFeeds").textContent = worldState.stats.autoFeeds || 0;

    const c = document.getElementById("speciesContainer");
    c.innerHTML = "";
    for (const [key, st] of Object.entries(worldState.speciesStats)) {
        if (st.adults + st.fry + st.eggs === 0) continue;
        const spec = worldState.species[key];
        const div = document.createElement("div");
        div.className = "species-item";
        div.style.borderLeftColor = spec.color.body;
        div.innerHTML = `<span class="species-icon">${SPECIES_ICONS[key] || "🐟"}</span>
            <div class="species-info"><div class="species-name">${spec.name}</div>
            <div class="species-latin">${spec.nameLatin}</div></div>
            <div class="species-count"><div class="count-adults">🐟 ${st.adults}</div>
            ${st.fry ? `<div class="count-fry">👶 ${st.fry}</div>` : ""}
            ${st.eggs ? `<div class="count-eggs">🥚 ${st.eggs}</div>` : ""}</div>`;
        c.appendChild(div);
    }

    const ev = document.getElementById("eventsContainer");
    ev.innerHTML = "";
    for (const e of [...worldState.events].reverse().slice(0, 20)) {
        const div = document.createElement("div");
        div.className = "event " + e.type;
        div.innerHTML = `<span class="event-time">Д${e.gameDay}</span>${e.message}`;
        ev.appendChild(div);
    }
}

// ===== ОТРИСОВКА =====
function updateScale() {
    const W = worldState.config.aquarium.width, H = worldState.config.aquarium.height;
    const s = Math.min((canvas.width - 40) / W, (canvas.height - 120) / H);
    scaleX = scaleY = s;
    offsetX = (canvas.width - W * s) / 2;
    offsetY = 60 + (canvas.height - 120 - H * s) / 2;
}
function toScreen(x, y) { return { x: offsetX + x * scaleX, y: offsetY + y * scaleY }; }

// ⭐ кэш статичного фона (вода, песок, камни)
function buildBackground() {
    bgCanvas = document.createElement("canvas");
    bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
    const b = bgCanvas.getContext("2d");
    const tl = toScreen(0, 0), br = toScreen(worldState.config.aquarium.width, worldState.config.aquarium.height);
    const aqW = br.x - tl.x, aqH = br.y - tl.y;

    b.strokeStyle = "#1a2a3a"; b.lineWidth = 4;
    b.strokeRect(tl.x - 4, tl.y - 4, aqW + 8, aqH + 8);

    const wg = b.createLinearGradient(tl.x, tl.y, tl.x, br.y);
    wg.addColorStop(0, "rgba(20,60,100,0.9)");
    wg.addColorStop(0.3, "rgba(15,50,80,0.95)");
    wg.addColorStop(1, "rgba(10,30,50,1)");
    b.fillStyle = wg; b.fillRect(tl.x, tl.y, aqW, aqH);

    const sandY = br.y - 80 * scaleY;
    const sg = b.createLinearGradient(tl.x, sandY, tl.x, br.y);
    sg.addColorStop(0, "#8B7355"); sg.addColorStop(0.3, "#6B5B45"); sg.addColorStop(1, "#4a3f30");
    b.fillStyle = sg; b.fillRect(tl.x, sandY, aqW, 80 * scaleY + 5);
    b.fillStyle = "rgba(255,255,255,0.05)";
    for (let i = 0; i < 200; i++) b.fillRect(tl.x + (i * 7 + 3) % aqW, sandY + (i * 13 + 5) % (80 * scaleY), 1, 1);

    for (const rock of worldState.rocks) {
        const p = toScreen(rock.x, rock.y);
        b.fillStyle = rock.color;
        b.beginPath(); b.ellipse(p.x, p.y, rock.width * scaleX / 2, rock.height * scaleY / 2, 0, 0, Math.PI * 2); b.fill();
        b.fillStyle = "rgba(255,255,255,0.1)";
        b.beginPath(); b.ellipse(p.x - rock.width * 0.15 * scaleX, p.y - rock.height * 0.15 * scaleY, rock.width * 0.15 * scaleX, rock.height * 0.1 * scaleY, -0.3, 0, Math.PI * 2); b.fill();
    }
}

function draw() {
    requestAnimationFrame(draw);
    if (!worldState) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
    updateScale();
    if (!bgCanvas) buildBackground();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bgCanvas, 0, 0);

    const tl = toScreen(0, 0), br = toScreen(worldState.config.aquarium.width, worldState.config.aquarium.height);
    ctx.save();
    ctx.beginPath(); ctx.rect(tl.x, tl.y, br.x - tl.x, br.y - tl.y); ctx.clip();

    // Растения (динамические)
    const time = Date.now() * 0.001;
    for (const plant of worldState.plants) drawPlant(plant, time);

    // ⭐ ПАКЕТНАЯ отрисовка корма
    ctx.fillStyle = "#D4A574";
    ctx.beginPath();
    for (const f of worldState.food) {
        const p = toScreen(f.x, f.y);
        const s = f.size * scaleX;
        ctx.moveTo(p.x + s, p.y);
        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
    }
    ctx.fill();

    // ⭐ ПАКЕТНАЯ отрисовка икры
    ctx.fillStyle = "rgba(255,255,200,0.8)";
    ctx.beginPath();
    for (const egg of worldState.eggs) {
        const p = toScreen(egg.x, egg.y);
        const s = Math.max(1.5, egg.size * scaleX);
        ctx.moveTo(p.x + s, p.y);
        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
    }
    ctx.fill();

    for (const c of worldState.corpses) drawCorpse(c);

    ctx.fillStyle = "rgba(100,255,100,0.4)";
    ctx.beginPath();
    for (const b of worldState.bacteria) {
        const p = toScreen(b.x, b.y);
        ctx.moveTo(p.x + 1.5, p.y);
        ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
    }
    ctx.fill();

    for (const fry of worldState.fry) drawFry(fry);
    hoveredEntity = null;
    for (const fish of worldState.fishes) drawFish(fish);

    // Пузырьки пакетно
    ctx.fillStyle = "rgba(200,230,255,0.3)";
    ctx.beginPath();
    for (const b of worldState.bubbles) {
        const p = toScreen(b.x, b.y);
        const s = b.size * scaleX;
        ctx.moveTo(p.x + s, p.y);
        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
    }
    ctx.fill();

    ctx.restore();

    if (hoveredEntity) drawTooltip(hoveredEntity);
    else document.getElementById("tooltip").style.display = "none";
}

function drawPlant(plant, time) {
    const base = toScreen(plant.x, plant.baseY);
    const sway = Math.sin(time * 0.5 + plant.swayOffset) * 8 * scaleX;
    const height = plant.height * scaleX;

    ctx.strokeStyle = "#2d5016"; ctx.lineWidth = 3 * scaleX;
    ctx.beginPath(); ctx.moveTo(base.x, base.y);
    let px = base.x, py = base.y;
    for (let i = 1; i <= 8; i++) {
        const t = i / 8;
        px = base.x + sway * t * t;
        py = base.y - (height / 8) * i;
        ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.fillStyle = "#3a8025";
    for (let i = 0; i < plant.leaves; i++) {
        const t = (i + 1) / (plant.leaves + 1);
        const lx = base.x + sway * t * t, ly = base.y - height * t;
        const ls = 25 * scaleX * (1 - t * 0.3);
        ctx.save();
        ctx.translate(lx, ly);
        ctx.rotate((i % 2 === 0 ? 1 : -1) * 0.5 + Math.sin(time * 0.8 + i) * 0.1);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(ls * 0.3, -ls * 0.2, ls * 0.8, -ls * 0.1, ls, 0);
        ctx.bezierCurveTo(ls * 0.8, ls * 0.1, ls * 0.3, ls * 0.2, 0, 0);
        ctx.fill();
        ctx.restore();
    }
}

function drawFish(fish) {
    const pos = toScreen(fish.x, fish.y);
    const size = fish.size * scaleX;
    const spec = worldState.species[fish.species];
    const dir = fish.facingRight ? 1 : -1;

    const dx = mouseX - pos.x, dy = mouseY - pos.y;
    if (dx * dx + dy * dy < (size + 10) * (size + 10)) hoveredEntity = { type: "fish", data: fish };

    ctx.save();
    ctx.translate(pos.x, pos.y + Math.sin(fish.swimPhase || 0) * size * 0.05);
    ctx.scale(dir, 1);

    const wag = Math.sin((fish.swimPhase || 0) * 2) * 0.3;
    ctx.fillStyle = spec.color.tail || spec.color.body;
    ctx.beginPath();
    ctx.moveTo(-size * 0.5, 0);
    ctx.lineTo(-size * 1.2 + Math.cos(wag) * size * 0.15, -size * 0.5);
    ctx.quadraticCurveTo(-size, 0, -size * 1.2 + Math.cos(wag) * size * 0.15, size * 0.5);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = spec.color.body;
    ctx.beginPath();
    if (fish.species === "angelfish") {
        ctx.moveTo(size * 0.7, 0);
        ctx.quadraticCurveTo(size * 0.3, -size * 0.8, 0, -size);
        ctx.quadraticCurveTo(-size * 0.3, -size * 0.8, -size * 0.5, 0);
        ctx.quadraticCurveTo(-size * 0.3, size * 0.8, 0, size);
        ctx.quadraticCurveTo(size * 0.3, size * 0.8, size * 0.7, 0);
    } else ctx.ellipse(0, 0, size * 0.8, size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    if (spec.color.stripe) {
        ctx.fillStyle = spec.color.stripe; ctx.globalAlpha = 0.7;
        ctx.beginPath(); ctx.ellipse(0, 0, size * 0.7, size * 0.15, 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
    }
    if (spec.color.stripes && fish.species === "angelfish") {
        ctx.strokeStyle = spec.color.stripes; ctx.lineWidth = size * 0.06;
        for (let i = -1; i <= 1; i++) {
            ctx.beginPath(); ctx.moveTo(i * size * 0.2, -size * 0.5); ctx.lineTo(i * size * 0.2, size * 0.5); ctx.stroke();
        }
    }
    if (spec.color.spots && fish.species === "cichlid") {
        ctx.fillStyle = spec.color.spots;
        ctx.beginPath();
        ctx.arc(size * 0.3, -size * 0.1, size * 0.12, 0, Math.PI * 2);
        ctx.arc(-size * 0.1, size * 0.15, size * 0.1, 0, Math.PI * 2);
        ctx.fill();
    }
    if (spec.hasSword && fish.gender === "male") {
        ctx.fillStyle = spec.color.sword || "#FFD700";
        ctx.beginPath();
        ctx.moveTo(-size * 1.1, 0); ctx.lineTo(-size * 2, size * 0.15); ctx.lineTo(-size * 1.1, size * 0.05);
        ctx.closePath(); ctx.fill();
    }

    ctx.fillStyle = spec.color.tail || spec.color.body;
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.moveTo(-size * 0.1, -size * 0.35);
    ctx.quadraticCurveTo(size * 0.1, -size * 0.7, size * 0.3, -size * 0.4);
    ctx.quadraticCurveTo(size * 0.2, -size * 0.35, -size * 0.1, -size * 0.35);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0, size * 0.35);
    ctx.quadraticCurveTo(size * 0.15, size * 0.6, size * 0.25, size * 0.4);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = "#FFF";
    ctx.beginPath(); ctx.arc(size * 0.45, -size * 0.08, size * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(size * 0.47, -size * 0.08, size * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#FFF";
    ctx.beginPath(); ctx.arc(size * 0.49, -size * 0.1, size * 0.03, 0, Math.PI * 2); ctx.fill();

    if (fish.pregnant) {
        ctx.fillStyle = "rgba(255,100,200,0.4)";
        ctx.beginPath(); ctx.arc(-size * 0.1, size * 0.1, size * 0.25, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    if (fish.hp < 100) {
        const bw = size * 1.5, bx = pos.x - bw / 2, by = pos.y - size - 10;
        const pct = Math.max(0, fish.hp / 100);
        ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(bx, by, bw, 4);
        ctx.fillStyle = pct > 0.5 ? "#00ff88" : pct > 0.25 ? "#ffcc00" : "#ff4444";
        ctx.fillRect(bx, by, bw * pct, 4);
    }
    if (size > 10) {
        ctx.fillStyle = "rgba(255,255,255,0.7)";
        ctx.font = Math.max(8, size * 0.3) + "px 'Segoe UI'";
        ctx.textAlign = "center";
        ctx.fillText(fish.name, pos.x, pos.y - size - 12);
    }
}

function drawFry(fry) {
    const pos = toScreen(fry.x, fry.y);
    const size = fry.size * scaleX;
    const dx = mouseX - pos.x, dy = mouseY - pos.y;
    if (dx * dx + dy * dy < (size + 8) * (size + 8)) hoveredEntity = { type: "fry", data: fry };

    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.scale(fry.facingRight ? 1 : -1, 1);
    ctx.fillStyle = "rgba(255,255,200,0.7)";
    ctx.beginPath(); ctx.ellipse(0, 0, size * 0.6, size * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    const spec = worldState.species[fry.species];
    ctx.fillStyle = spec.color.body; ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.moveTo(-size * 0.5, 0); ctx.lineTo(-size, -size * 0.25); ctx.lineTo(-size, size * 0.25);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(size * 0.3, -size * 0.05, size * 0.08, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function drawCorpse(c) {
    const pos = toScreen(c.x, c.y);
    const size = c.size * scaleX;
    const d = c.decomposition / 100;
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.scale(c.facingRight ? 1 : -1, -1);
    ctx.globalAlpha = 1 - d * 0.5;
    const g = Math.floor(200 - d * 100);
    ctx.fillStyle = `rgb(${g},${g},${g})`;
    ctx.beginPath(); ctx.ellipse(0, 0, size * 0.8, size * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgb(${Math.max(0,g-30)},${Math.max(0,g-30)},${Math.max(0,g-30)})`;
    ctx.beginPath();
    ctx.moveTo(-size * 0.5, 0); ctx.lineTo(-size, -size * 0.3); ctx.lineTo(-size, size * 0.3);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#000"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(size * 0.4, -size * 0.15); ctx.lineTo(size * 0.55, 0);
    ctx.moveTo(size * 0.55, -size * 0.15); ctx.lineTo(size * 0.4, 0);
    ctx.stroke();
    ctx.restore();
}

function drawTooltip(entity) {
    const tooltip = document.getElementById("tooltip");
    let html = "";
    if (entity.type === "fish") {
        const f = entity.data, spec = worldState.species[f.species];
        html = `<div class="tooltip-name" style="color:${spec.color.body}">${f.name} ${f.gender === "male" ? "♂" : "♀"}</div>
            <div class="tooltip-species">${spec.name} (${spec.nameLatin})</div>
            <div class="tooltip-stats">
                <span class="tooltip-label">Поколение:</span><span class="tooltip-value">gen ${f.generation}</span>
                <span class="tooltip-label">Возраст:</span><span class="tooltip-value">${Math.floor(f.age)} / ${f.lifespan} дн.</span>
                <span class="tooltip-label">Размер:</span><span class="tooltip-value">${f.size.toFixed(1)} мм</span>
            </div>
            <div style="margin-top:8px;font-size:11px;color:#888;">Энергия: ${Math.round(f.energy)}%</div>
            <div class="bar-mini"><div class="bar-mini-fill" style="width:${Math.max(0,f.energy)}%;background:#ffcc00"></div></div>
            <div style="font-size:11px;color:#888;">HP: ${Math.round(f.hp)}%</div>
            <div class="bar-mini"><div class="bar-mini-fill" style="width:${Math.max(0,f.hp)}%;background:#00ff88"></div></div>
            ${f.pregnant ? `<div style="margin-top:6px;color:#ff69b4">🤰 Беременна (${Math.floor(f.gestationLeft)} дн.)</div>` : ""}`;
    } else {
        const f = entity.data, spec = worldState.species[f.species];
        html = `<div class="tooltip-name" style="color:#98fb98">👶 ${f.name}</div>
            <div class="tooltip-species">Малёк ${spec.name}</div>
            <div class="tooltip-stats">
                <span class="tooltip-label">Поколение:</span><span class="tooltip-value">gen ${f.generation}</span>
                <span class="tooltip-label">Возраст:</span><span class="tooltip-value">${Math.floor(f.growthDays)} дн.</span>
            </div>`;
    }
    tooltip.innerHTML = html;
    tooltip.style.display = "block";
    tooltip.style.left = (mouseX + 20) + "px";
    tooltip.style.top = (mouseY - 10) + "px";
    const r = tooltip.getBoundingClientRect();
    if (r.right > innerWidth) tooltip.style.left = (mouseX - r.width - 10) + "px";
    if (r.bottom > innerHeight) tooltip.style.top = (mouseY - r.height) + "px";
}

canvas.addEventListener("mousemove", e => { mouseX = e.clientX; mouseY = e.clientY; });

ensureServer();
requestAnimationFrame(draw);
</script>
</body>
</html>
